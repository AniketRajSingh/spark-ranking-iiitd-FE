<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SPARK — Research Venues</title>
  <meta name="description" content="View computer science research venues, including CORE A* / A conferences and ACM/IEEE journals." />
  <link rel="icon" href="../logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/tailwind.css" />
  <style>
    body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
    .hero-gradient { background: linear-gradient(135deg, #f0fdfa 0%, #e0f2fe 50%, #f0fdf4 100%); }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 antialiased">

  <div id="navbar-placeholder"></div>

  <!-- Header -->
  <section class="hero-gradient border-b border-gray-100 py-10">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 tracking-tight">
        CORE CS Conferences & Venues
      </h1>
      <p class="mt-2 text-sm sm:text-base text-gray-600 max-w-xl">
        Elite publication venues categorized by subfields, used to calculate academic ranking scores.
      </p>
    </div>
  </section>

  <!-- Main Grid -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
    
    <!-- Top Filter Panel -->
    <div id="filter-panel">
      <!-- FilterWidget renders here -->
    </div>

    <!-- Search Bar -->
    <div class="w-full text-gray-800" id="search-bar-container"></div>

    <!-- Conference List -->
    <div class="w-full">
      <div class="card p-0 overflow-hidden bg-white">
        <div class="flex items-center justify-between px-5 py-4 border-b border-gray-100">
          <h2 class="text-base font-semibold text-gray-800 font-sans">Eligible Venues</h2>
        </div>
        <div id="conference-list" aria-busy="true" aria-live="polite">
          <!-- ConferenceListWidget renders here -->
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-gray-100 mt-8">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col sm:flex-row items-center justify-between gap-3">
      <p class="text-sm text-gray-400">
        © <span id="footer-year"></span> SPARK — Scholarly Publication & Academic Ranking Knowledgebase
      </p>
      <div class="flex items-center gap-4 text-sm text-gray-400">
        <a href="./methodology.html" class="hover:text-teal-600 transition-colors">Methodology</a>
        <a href="./about.html" class="hover:text-teal-600 transition-colors">About</a>
        <a href="https://github.com" target="_blank" rel="noopener noreferrer" class="hover:text-teal-600 transition-colors">GitHub</a>
      </div>
    </div>
  </footer>

  <!-- Publications Modal Overlay -->
  <div id="publication-modal" class="fixed inset-0 z-50 overflow-y-auto hidden animate-fade-in" role="dialog" aria-modal="true">
    <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:block sm:p-0">
      <!-- Backdrop overlay -->
      <div class="fixed inset-0 transition-opacity bg-gray-900/60 backdrop-blur-sm" id="modal-backdrop"></div>
      
      <!-- Center modal contents -->
      <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
      
      <div class="inline-block align-bottom bg-white rounded-2xl text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-4xl sm:w-full border border-gray-100">
        <!-- Header -->
        <div class="bg-gradient-to-r from-teal-50 to-cyan-50 px-6 py-4 border-b border-gray-100 flex items-center justify-between">
          <div>
            <h3 class="text-lg font-bold text-gray-900" id="modal-title">Venue Publications</h3>
            <p class="text-xs text-gray-500 mt-0.5" id="modal-subtitle">Loading venue details...</p>
          </div>
          <button
            type="button"
            id="modal-close"
            class="text-gray-400 hover:text-gray-600 focus:outline-none p-1.5 hover:bg-gray-100 rounded-lg transition-colors"
            aria-label="Close modal"
          >
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>
        
        <!-- Content -->
        <div class="px-6 py-6 max-h-[60vh] overflow-y-auto" id="modal-body">
          <!-- Table/List will render here -->
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../js/navbar.js"></script>
  <script src="../env.js"></script>
  <script src="../js/config.js"></script>
  <script type="module" src="../js/pages/conference.js"></script>

  <script>
    document.getElementById('footer-year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
