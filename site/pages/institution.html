<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SPARK — Institution Profile</title>
  <meta name="description" content="Detailed publications breakdown, academic ranking trends, and top faculty of the selected institution." />
  <link rel="icon" href="../logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/tailwind.css" />
  <!-- Chart.js CDN in head so it is loaded before any module scripts run -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
    .hero-gradient { background: linear-gradient(135deg, #f0fdfa 0%, #e0f2fe 50%, #f0fdf4 100%); }
    .spark-tooltip-box {
      display: none;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease, transform 0.2s ease;
      transform: translateY(-4px);
    }
    .spark-tooltip-container:hover .spark-tooltip-box,
    .spark-tooltip-container:focus-within .spark-tooltip-box {
      display: block !important;
      pointer-events: auto !important;
      opacity: 1 !important;
      transform: translateY(0);
    }
    .inst-filters-row {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
      width: 100%;
    }
    .inst-filters-row .inst-filter-item {
      flex: 1;
      min-width: 0;
    }
    .inst-filters-row .inst-filter-search {
      flex: 1.2;
    }
    .inst-filters-row .inst-filter-rank {
      flex: 1.1;
    }
    .inst-score-sublabel {
      font-size: 8.5px;
      line-height: 1.1;
      color: #9ca3af;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 600;
    }
    @media (max-width: 640px) {
      .inst-filters-row {
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 antialiased">

  <div id="navbar-placeholder"></div>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 institution-profile">
    <!-- InstitutionProfileWidget renders here dynamically -->
  </main>

  <!-- Footer -->
  <footer class="border-t border-gray-100 mt-8">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col sm:flex-row items-center justify-between gap-3">
      <p class="text-sm text-gray-400">
        © <span id="footer-year"></span> SPARK — Scholarly Publication & Academic Ranking Knowledgebase
      </p>
      <div class="flex items-center gap-4 text-sm text-gray-400">
        <a href="./methodology.html" class="hover:text-teal-600 transition-colors">Methodology</a>
        <a href="./about.html" class="hover:text-teal-600 transition-colors">About</a>
        <a href="https://github.com" target="_blank" rel="noopener noreferrer" class="hover:text-teal-600 transition-colors">GitHub</a>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="../js/navbar.js"></script>
  <script src="../env.js"></script>
  <script src="../js/config.js"></script>
  <script type="module" src="../js/pages/institution.js"></script>

  <script>
    document.getElementById('footer-year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
