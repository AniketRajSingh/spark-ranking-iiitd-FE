<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ICSRank — Institution</title>
  <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <div id="navbar-placeholder"></div>

    <main class="max-w-6xl mx-auto px-4 py-6 institution-profile">
      <section class="bg-white shadow rounded p-6 mb-6">
        <h2 id="inst-name" class="text-2xl font-semibold text-gray-900"></h2>
        <p class="mt-2">Website: <a id="inst-website" href="#" target="_blank" rel="noopener noreferrer" class="text-teal-600"></a></p>
        <p id="inst-summary" class="mt-4 text-gray-700">Overview and quick stats will appear here.</p>
      </section>

      <section class="bg-white shadow rounded p-6">
        <h3 class="text-lg font-semibold mb-3">Top Faculty</h3>
        <ul id="top-faculty" class="space-y-2"></ul>
      </section>
    </main>

    <footer class="max-w-6xl mx-auto px-4 py-6 text-gray-600 text-sm">
      <p>© ICSRank</p>
    </footer>
  <script src="/site/js/navbar.js"></script>
  <script src="/site/env.js"></script>
  <script src="/site/js/config.js"></script>
  <script src="/site/js/utils/sanitize.js"></script>
  <script src="/site/js/utils/errorCard.js"></script>
  <script src="/site/js/utils/fetchJSON.js"></script>
  <script src="/site/js/widgets/InstitutionProfile.js"></script>
  <script src="/site/js/app.js"></script>
  </body>
</html>
