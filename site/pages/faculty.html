<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SPARK — Top Faculty Rankings</title>
  <meta name="description" content="View top CS research faculty in Indian institutions based on weighted CORE A*/A publication scores." />
  <link rel="icon" href="../logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/tailwind.css" />
  <style>
    body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
    .hero-gradient { background: linear-gradient(135deg, #f0fdfa 0%, #e0f2fe 50%, #f0fdf4 100%); }
    .search-clear { display: none; }
    .search-wrapper:focus-within .search-clear,
    .search-wrapper.has-value .search-clear { display: flex; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 antialiased">

  <div id="navbar-placeholder"></div>

  <!-- Header -->
  <section class="hero-gradient border-b border-gray-100 py-10">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 tracking-tight">
        Top CS Research Faculty
      </h1>
      <p class="mt-2 text-sm sm:text-base text-gray-600 max-w-xl">
        Indian CS faculty ranked by cumulative fractional authorship credits in top-tier CORE A* and A venues.
      </p>
    </div>
  </section>

  <!-- Main Grid -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
    
    <!-- Top Filter Panel -->
    <div id="filter-panel">
      <!-- FilterWidget renders here -->
    </div>

    <!-- Search bar for faculties -->
    <div class="relative search-wrapper" id="search-wrapper">
      <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
        <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z"/>
        </svg>
      </div>
      <input
        id="search-input"
        type="search"
        placeholder="Search faculty by name…"
        class="w-full pl-10 pr-10 py-2.5 border border-gray-200 rounded-lg text-sm bg-white text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-teal-500/20 focus:border-teal-500 transition-all shadow-sm"
        aria-label="Search faculty"
        autocomplete="off"
      />
      <button
        id="search-clear"
        class="search-clear absolute inset-y-0 right-0 items-center pr-3 text-gray-400 hover:text-gray-600"
        aria-label="Clear search"
        type="button"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>

    <!-- Faculty List -->
    <div class="w-full">
      <div class="card p-0 overflow-hidden bg-white">
        <div class="flex items-center justify-between px-5 py-4 border-b border-gray-100">
          <h2 class="text-base font-semibold text-gray-800">Faculty Leaderboard</h2>
        </div>
        <div id="faculty-listing" aria-busy="true" aria-live="polite" class="bg-white">
          <!-- FacultyListWidget renders here -->
        </div>
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="border-t border-gray-100 mt-8">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col sm:flex-row items-center justify-between gap-3">
      <p class="text-sm text-gray-400">
        © <span id="footer-year"></span> SPARK — Scholarly Publication & Academic Ranking Knowledgebase
      </p>
      <div class="flex items-center gap-4 text-sm text-gray-400">
        <a href="./methodology.html" class="hover:text-teal-600 transition-colors">Methodology</a>
        <a href="./about.html" class="hover:text-teal-600 transition-colors">About</a>
        <a href="https://github.com" target="_blank" rel="noopener noreferrer" class="hover:text-teal-600 transition-colors">GitHub</a>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="../js/navbar.js"></script>
  <script src="../env.js"></script>
  <script src="../js/config.js"></script>
  <script type="module" src="../js/pages/faculty.js"></script>

  <script>
    document.getElementById('footer-year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
