server {
    listen 80;
    server_name _;

    client_max_body_size 25M;

    # Serve Frontend Static Site
    location / {
        root /usr/share/nginx/html;
        index index.html;
        autoindex off;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the Django backend.
    # Deployed as a *separate* Render service, so this has to be its public
    # HTTPS URL rather than a docker-compose service name like "backend:8001"
    # -- Render's private network can't be used here because a free-tier
    # backend can send private-network requests but can't receive them.
    # Update this hostname if the backend Render service is renamed.
    location /api/ {
        proxy_ssl_server_name on;
        proxy_pass https://spark-backend.onrender.com/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy Django Admin requests
    location /admin/ {
        proxy_ssl_server_name on;
        proxy_pass https://spark-backend.onrender.com/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
